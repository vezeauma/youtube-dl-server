<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1" >
  <meta name="description" content="Web frontend for yt-dlp" >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
  >
  <style>
    body {
      background-color: #002b36;
      padding-top: 70px;
    }

    div.input-group > select.form-select {
      flex: 0.1 1 100px;
    }
  </style>

  <title>youtube-dl</title>
</head>

<body class="d-flex h-100 text-center text-white flex-column">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
          <a class="navbar-brand" href="/youtube-dl">Home</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link" href="/youtube-dl/list">List of files</a>
                  </li>
              </ul>
          </div>
      </div>
  </nav>
  <div class="container d-flex w-100 p-3 flex-column">
    <main class="px-3">
      <h1 class="display-4">youtube-dl</h1>
      <p class="lead">
        Enter a video URL to download the video to the server. The URL can be
        from YouTube or
        <a
          class="text-info"
          href="https://github.com/yt-dlp/yt-dlp/blob/master/supportedsites.md"
          >any other supported site</a
        >. The server will automatically download the highest quality version
        available.
      </p>
      <form action="/youtube-dl/q" method="POST">
        <input type="hidden" name="ui" value="true" >
        <div class="input-group">
          <input
            name="url"
            type="url"
            class="form-control"
            placeholder="URL"
            aria-label="URL"
            aria-describedby="button-submit"
            autofocus
          >
          <select class="form-select" name="format">
            <optgroup label="Video">
              <option value="mp4_full">MP4 (Full résolution)</option>
              <option value="mp4_720">MP4 (720p H.264)</option>
            </optgroup>
            <optgroup label="Audio">
              <option value="mp3">MP3</option>
            </optgroup>
          </select>
          <button class="btn btn-primary" type="submit" id="button-submit">
            Submit
          </button>
        </div>
      </form>
    </main>
    </div>
    <footer class="mt-auto text-muted">
      <div id="liveAlertPlaceholder"></div>
      <p>
        Web frontend for
        <a class="text-light" href="https://github.com/yt-dlp/yt-dlp"
          >yt-dlp</a
        >
        v{{ ytdlp_version }}, by
        <a class="text-light" href="https://twitter.com/manbearwiz"
          >@manbearwiz</a
        >.
      </p>
    </footer>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"
  ></script>
  <script>
    var alertPlaceholder = document.getElementById('liveAlertPlaceholder');

    const urlParams = new URLSearchParams(window.location.search);
    const added = urlParams.get('added');

    function alert(message, type) {
      var wrapper = document.createElement('div');
      wrapper.innerHTML =
        '<div class="alert alert-' +
        type +
        ' alert-dismissible" role="alert">' +
        message +
        '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>';
      alertPlaceholder.append(wrapper);
    }

    if (added) {
      alert(
        'Successfully added <a href=' +
          added +
          '>one item</a> to the download queue',
        'success',
      );
    }
  </script>
</body>
</html>
