<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Web frontend for yt-dlp" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #002b36;
      }

      div.input-group > select.form-select {
        flex: 0.1 1 100px;
      }
    </style>
    <title>List of files</title>
</head>
<body class="d-flex h-100 text-center text-white">
    <div class="container d-flex w-100 p-3 flex-column">
        <header class="mb-auto"></header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
            <a class="navbar-brand" href="/youtube-dl">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/youtube-dl">Back to home</a>
                </li>
                </ul>
            </div>
            </div>
        </nav>

        <h1>Available Files</h1>
        <main class="px-3">
            <form method="post" action="/youtube-dl/delete">
                <table border="1" cellpadding="5">
                    <thead>
                        <tr>
                            <th>Choose</th>
                            <th>File name</th>
                            <th>Download</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for file in files %}
                        <tr>
                            <td><input type="checkbox" name="files" value="{{ file }}"></td>
                            <td>{{ file }}</td>
                            <td><a href="/youtube-dl/files/{{ file }}" target="_blank">Download</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <br>
                <button type="submit">Delete selection</button>
            </form>
        </main>
    </div>
</body>
</html>
