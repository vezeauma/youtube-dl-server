<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1" >
    <meta name="description" content="Web frontend for yt-dlp" >

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    >
    <style>
      body {
        background-color: #002b36;
        padding-top: 70px;
      }

      div.input-group > select.form-select {
        flex: 0.1 1 100px;
      }
    </style>
    <title>List of files</title>
</head>

<body class="d-flex h-100 text-center text-white flex-column">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/youtube-dl">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                      <a class="nav-link" href="/youtube-dl/list">List of files</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex w-100 p-3 flex-column">
        <main class="px-3">
            <h1>Available Files</h1>
            <form method="post" action="/youtube-dl/delete">
                <table border="1" class="table table-dark table-striped">
                    <thead>
                        <tr>
                            <th scope="col">Choose</th>
                            <th scope="col" onclick="sortTable(1)">File name ⬍</th>
                            <th scope="col" onclick="sortTable(2)">Modified ⬍</th>
                            <th scope="col">Download</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for file in files %}
                        <tr>
                            <td><input type="checkbox" name="files" value="{{ file.name }}"></td>
                            <td>{{ file.name }}</td>
                            <td>{{ file.modified }}</td>
                            <td><a href="/youtube-dl/files/{{ file.name }}" target="_blank">Download</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <br>
                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirmDeleteModal">
                    Delete selection
                </button>
                <button type="submit" class="d-none" id="realSubmitButton">Submit</button>
            </form>
        </main>
    </div>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"
    ></script>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header">
            <h5 class="modal-title" id="confirmDeleteModalLabel">Confirm Deletion</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
            Are you sure you want to delete the selected files?
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" onclick="submitDeleteForm()">Delete</button>
            </div>
        </div>
        </div>
    </div>
    <script>
        function submitDeleteForm() {
            document.getElementById('realSubmitButton').click();
        }
    </script>
    <script>
        function sortTable(colIndex) {
            const table = document.querySelector("table");
            const tbody = table.tBodies[0];
            const rows = Array.from(tbody.rows);

            const asc = table.getAttribute("data-sort-dir") !== "asc";
            table.setAttribute("data-sort-dir", asc ? "asc" : "desc");

            rows.sort((a, b) => {
                let aText = a.cells[colIndex].innerText.trim();
                let bText = b.cells[colIndex].innerText.trim();

                // Try to parse date
                const aDate = Date.parse(aText);
                const bDate = Date.parse(bText);

                if (!isNaN(aDate) && !isNaN(bDate)) {
                    return asc ? aDate - bDate : bDate - aDate;
                }

                return asc ? aText.localeCompare(bText) : bText.localeCompare(aText);
            });

            rows.forEach(row => tbody.appendChild(row));
        }
    </script>
</body>
</html>
