<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Web frontend for yt-dlp" />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous"
    />
    <style>
        body {
        background-color: #002b36;
        }

        div.input-group > select.form-select {
        flex: 0.1 1 100px;
        }
    </style>
    <title>Login</title>
</head>
<body class="d-flex h-100 text-center text-white">
    <div class="container d-flex w-100 p-3 flex-column">
        <h2>Log in</h2>
        <form method="post" action="/youtube-dl/login">
            <input type="text" name="username" placeholder="User name" required><br><br>
            <input type="password" name="password" placeholder="Password" required><br><br>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
